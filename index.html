<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Snake: Succinct Mode</title>
  <style>
    body {
      margin: 0;
      background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACAAAAAPXCAYAAAC/m6tdAAEAAElEQVR4nOxddbwctfb/Znb3utbl1t2oUYq0FCjuUNwe8NAiPx7u/tACheJWHF5xWrRQpIUCdeql7u69ujv5/TGWZJLZ2SvtvSVfPvTOziQnJycnJydO5gz7nbYf2...") no-repeat center center / cover;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #gameCanvas {
      display: block;
      margin: 0 auto;
      background-color: #2e002e;
      border: 4px solid #ffb3e6;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff5d0;
      font-size: 24px;
      text-shadow: 1px 1px 2px #ff1493;
      z-index: 10;
    }
    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #fff5d0;
      border-radius: 50%;
      animation: twinkle 2s infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.75);
      color: #fff5d0;
      display: none;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      z-index: 20;
      flex-direction: column;
    }
    #restartBtn, #generateBtn {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 18px;
      background-color: #ff69b4;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="score">⭐ Stars: 0</div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="overlay">
    <div>Game Over!</div>
    <button id="generateBtn">Generate Proof</button>
    <button id="restartBtn">Restart</button>
  </div>
  <div id="proofBox" style="position:absolute; bottom:10px; left:50%; transform:translateX(-50%); color:#fff5d0; font-size:14px; font-family:monospace; text-align:center; z-index:25;"></div>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    let snake, dx, dy, star, score, highScore = 0, loop;
    const overlay = document.getElementById("overlay");
    const restartBtn = document.getElementById("restartBtn");
    const generateBtn = document.getElementById("generateBtn");

    // Safely get high score from localStorage with fallback
    function safeGetHighScore() {
      try {
        return localStorage.getItem('highScore') || 0;
      } catch (e) {
        // If localStorage is not available (like in a sandbox)
        return 0;
      }
    }

    // Safely set high score to localStorage with error handling
    function safeSetHighScore(value) {
      try {
        localStorage.setItem('highScore', value);
      } catch (e) {
        // Silently fail if localStorage is not available
        console.log("Cannot save high score: localStorage not available");
      }
    }

    function initGame() {
      snake = [{ x: 10, y: 10 }];
      dx = 0;
      dy = 0;
      star = spawnStar();
      score = 0;
      highScore = safeGetHighScore();
      updateScoreDisplay();
      overlay.style.display = "none";
      document.getElementById("proofBox").innerText = "";
      clearInterval(loop);
      loop = setInterval(gameLoop, 120);
    }

    for (let i = 0; i < 30; i++) {
      const star = document.createElement("div");
      star.className = "star";
      star.style.top = Math.random() * window.innerHeight + "px";
      star.style.left = Math.random() * window.innerWidth + "px";
      document.body.appendChild(star);
    }

    function spawnStar() {
      return {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount),
      };
    }

    function gameLoop() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);

      if (head.x === star.x && head.y === star.y) {
        score++;
        updateScoreDisplay();
        star = spawnStar();
      } else {
        snake.pop();
      }

      if (
        head.x < 0 || head.x >= tileCount ||
        head.y < 0 || head.y >= tileCount ||
        snake.slice(1).some(segment => segment.x === head.x && segment.y === head.y)
      ) {
        clearInterval(loop);
        overlay.style.display = "flex";
        if (score > highScore) {
          safeSetHighScore(score);
          highScore = score;
        }
        return;
      }

      drawGame();
    }

    function drawGame() {
      ctx.fillStyle = "#2e002e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < snake.length; i++) {
        const part = snake[i];
        const alpha = 1 - (i / snake.length) * 0.7;
        ctx.fillStyle = i === 0 ? "#ff1493" : `rgba(255, 111, 191, ${alpha.toFixed(2)})`;
        ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
      }

      drawStar(star.x * gridSize + gridSize / 2, star.y * gridSize + gridSize / 2, 5, 6, 3);
    }

    function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fillStyle = "#fff5d0";
      ctx.fill();
    }

    function updateScoreDisplay() {
      document.getElementById("score").innerText = `⭐ Stars: ${score} (High Score: ${highScore})`;
    }

    function generateProof(score) {
      const fakeHash = btoa(score + ':' + Date.now()).slice(0, 16);
      document.getElementById("proofBox").innerText = `Proof generated: 0x${fakeHash}`;
    }

    document.addEventListener("keydown", e => {
      switch (e.key) {
        case "ArrowUp": if (dy === 0) [dx, dy] = [0, -1]; break;
        case "ArrowDown": if (dy === 0) [dx, dy] = [0, 1]; break;
        case "ArrowLeft": if (dx === 0) [dx, dy] = [-1, 0]; break;
        case "ArrowRight": if (dx === 0) [dx, dy] = [1, 0]; break;
      }
    });

    restartBtn.addEventListener("click", initGame);
    generateBtn.addEventListener("click", () => generateProof(score));

    initGame();
  </script>
</body>
</html>
